spring:
  application:
    name: expo-report-server
  main:
    # stdout은 JSON 로그 줄만 둔다(배너는 여러 줄 평문이라 로그 수집기가 줄마다 깨진 로그로 받는다)
    banner-mode: "off"
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:35432}/${POSTGRES_DB:expo_report}
    username: ${POSTGRES_USER:expo}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    user:
      name: ${LOCAL_SECURITY_USER:developer}
      password: ${LOCAL_SECURITY_PASSWORD}

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8083}

eureka:
  client:
    enabled: false

swagger:
  enabled: ${SWAGGER_ENABLED:false}
  include-internal: ${SWAGGER_INCLUDE_INTERNAL:false}

springdoc:
  api-docs:
    enabled: ${swagger.enabled}
    path: /stat/v3/api-docs
  swagger-ui:
    enabled: ${swagger.enabled}
    path: /stat/swagger-ui.html

# 엑셀 원천 공급자 내부 API. 주소·토큰은 기본값 없이 비어 있으면 기동에 실패한다.
clients:
  connect-timeout: ${CLIENT_CONNECT_TIMEOUT:3s}
  read-timeout: ${CLIENT_READ_TIMEOUT:10s}
  user:
    url: ${USER_SERVICE_URL}
    internal-token: ${USER_INTERNAL_TOKEN}
  application:
    url: ${APPLICATION_SERVICE_URL}
    internal-token: ${APPLICATION_INTERNAL_TOKEN}
  expo:
    url: ${EXPO_SERVICE_URL}
    internal-token: ${EXPO_INTERNAL_TOKEN}
  # 입장 기록 엑셀 전용 선택 공급자. 둘 다 비우면 그 다운로드만 503이고 기동에는 영향이 없다(둘 중 하나만 있으면 기동 실패).
  attendance:
    url: ${ATTENDANCE_SERVICE_URL:}
    internal-token: ${ATTENDANCE_INTERNAL_TOKEN:}
  # 공개 설문 응답 엑셀 전용 선택 공급자(Form #215). 규칙은 attendance와 같다.
  form:
    url: ${FORM_SERVICE_URL:}
    internal-token: ${FORM_INTERNAL_TOKEN:}
